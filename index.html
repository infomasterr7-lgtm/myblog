<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المدونة التقنية الشخصية</title>
    <style>
        body { background-color: #f4f6f9; font-family: Arial, sans-serif; text-align: center; padding: 50px; color: #333; }
        .container { background-color: #ffffff; padding: 30px; display: inline-block; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); width: 80%; max-width: 500px; margin-top: 50px; }
        h1 { color: #2c3e50; margin-bottom: 15px; font-size: 28px; }
        p { font-size: 18px; color: #555; line-height: 1.6; margin-bottom: 25px; }
        .btn-group { display: flex; flex-direction: column; gap: 15px; align-items: center; }
        .btn { padding: 12px 24px; font-size: 16px; color: white; border: none; border-radius: 6px; cursor: pointer; display: inline-block; text-decoration: none; width: 80%; font-weight: bold; transition: 0.3s; }
        .btn-games { background-color: #2e7d32; }
        .btn-games:hover { background-color: #1b5e20; }
        .btn-apps { background-color: #2980b9; }
        .btn-apps:hover { background-color: #2471a3; }
    </style>
</head>
<body>
    <div class="container">
        <h1>المدونة التقنية الشخصية 🚀</h1>
        <p>الأفكار الذكية والشروحات التقنية المبسطة للجميع.</p>
        <div class="btn-group">
            <a href="game1.html" class="btn btn-games">قسم الألعاب الحصرية 🎮</a>
            <a href="apps.html" class="btn btn-apps">قسم التطبيقات المعدلة 📱</a>
        </div>
    </div>
</body>
</html>
